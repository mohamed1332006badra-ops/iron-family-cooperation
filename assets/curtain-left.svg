<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 1000" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <!-- Ultra-Deep Velvet Flute Gradient 1 -->
    <linearGradient id="vFlute1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#140103" />
      <stop offset="18%" stop-color="#48050C" />
      <stop offset="38%" stop-color="#8C0D18" />
      <stop offset="52%" stop-color="#C21626" />
      <stop offset="56%" stop-color="#F24E60" />
      <stop offset="60%" stop-color="#C21626" />
      <stop offset="78%" stop-color="#6E0A13" />
      <stop offset="92%" stop-color="#2D0307" />
      <stop offset="100%" stop-color="#110103" />
    </linearGradient>

    <!-- Ultra-Deep Velvet Flute Gradient 2 -->
    <linearGradient id="vFlute2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A0205" />
      <stop offset="22%" stop-color="#55070F" />
      <stop offset="44%" stop-color="#9E101D" />
      <stop offset="54%" stop-color="#D61B2E" />
      <stop offset="58%" stop-color="#FFA0AC" />
      <stop offset="62%" stop-color="#D61B2E" />
      <stop offset="80%" stop-color="#7B0C16" />
      <stop offset="100%" stop-color="#180204" />
    </linearGradient>

    <!-- Silk Specular Sheen Overlay -->
    <linearGradient id="silkSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)" />
      <stop offset="15%" stop-color="rgba(255,180,195,0.35)" />
      <stop offset="45%" stop-color="rgba(255,200,210,0.12)" />
      <stop offset="70%" stop-color="rgba(255,160,180,0.25)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>

    <filter id="velvet3DShadow" x="-30%" y="-10%" width="170%" height="120%">
      <feDropShadow dx="20" dy="0" stdDeviation="22" flood-color="#000000" flood-opacity="0.95" />
    </filter>
  </defs>

  <g filter="url(#velvet3DShadow)">
    <path d="M 0,0 L 70,0 C 60,300 45,600 35,1000 L 0,1000 Z" fill="url(#vFlute1)" />
    <path d="M 22,0 C 28,300 24,600 18,1000 L 26,1000 C 34,600 36,300 30,0 Z" fill="url(#silkSheen)" opacity="0.6" />

    <path d="M 45,0 L 120,0 C 105,250 85,500 70,1000 L 35,1000 C 45,600 60,300 70,0 Z" fill="url(#vFlute2)" />
    <path d="M 72,0 C 82,250 72,500 58,1000 L 66,1000 C 80,500 90,250 80,0 Z" fill="url(#silkSheen)" opacity="0.75" />

    <path d="M 95,0 L 175,0 C 150,240 120,490 105,1000 L 65,1000 C 80,500 100,250 115,0 Z" fill="url(#vFlute1)" />
    <path d="M 125,0 C 142,240 122,490 98,1000 L 106,1000 C 130,490 150,240 133,0 Z" fill="url(#silkSheen)" opacity="0.85" />

    <path d="M 145,0 C 210,220 160,460 130,550 C 105,650 155,830 195,1000 L 140,1000 C 115,830 85,650 105,550 C 130,460 170,220 120,0 Z" fill="url(#vFlute2)" />
    <path d="M 158,0 C 205,220 162,460 128,550 C 110,650 148,830 182,1000 L 188,1000 C 154,830 116,650 134,550 C 168,460 212,220 166,0 Z" fill="url(#silkSheen)" opacity="0.9" />

    <path d="M 180,0 C 255,220 195,460 150,550 C 125,650 185,830 235,1000 L 205,1000 C 165,830 115,650 140,550 C 180,450 235,220 170,0 Z" fill="url(#vFlute1)" />
    <path d="M 195,0 C 250,220 200,450 155,550 C 135,650 188,830 228,1000 L 234,1000 C 194,830 141,650 161,550 C 206,450 258,220 203,0 Z" fill="url(#silkSheen)" opacity="0.95" />
  </g>
</svg>
