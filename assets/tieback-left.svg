<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="100%" height="100%">
  <defs>
    <!-- 3D Metallic Gold Gradient for Braided Rope -->
    <linearGradient id="ropeGold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#8C6A12" />
      <stop offset="90%" stop-color="#FFEFA8" />
      <stop offset="100%" stop-color="#553E08" />
    </linearGradient>

    <!-- Tassel Core Gradient -->
    <linearGradient id="tasselHeadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#553E08" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF5BE" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#3D2B05" />
    </linearGradient>

    <linearGradient id="fringeSkirtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A3406" />
      <stop offset="20%" stop-color="#AA8219" />
      <stop offset="40%" stop-color="#FFF2A3" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#8C6A12" />
      <stop offset="100%" stop-color="#332404" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="tiebackShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-8" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <g filter="url(#tiebackShadow)">
    <!-- Heavy Braided Golden Rope Swag -->
    <!-- Lower strand -->
    <path d="M 0,40 C 60,65 120,95 150,130 C 130,145 70,105 0,75 Z" fill="url(#ropeGold3D)" stroke="#553E08" stroke-width="1.5" />
    <!-- Upper strand -->
    <path d="M 0,20 C 65,45 130,75 160,110 C 145,125 80,85 0,55 Z" fill="url(#ropeGold3D)" stroke="#553E08" stroke-width="1.5" />

    <!-- Rope Braided Segments / Twist Highlights -->
    <g fill="none" stroke="#FFEFA8" stroke-width="2" opacity="0.8">
      <path d="M 25,32 Q 35,42 22,50" />
      <path d="M 50,44 Q 60,56 46,65" />
      <path d="M 75,58 Q 88,72 70,82" />
      <path d="M 100,74 Q 115,90 95,102" />
      <path d="M 125,92 Q 140,110 120,122" />
    </g>

    <!-- Ornate Wall Mount Brass Ring / Medallion -->
    <circle cx="160" cy="115" r="16" fill="url(#ropeGold3D)" stroke="#3D2B05" stroke-width="2.5" />
    <circle cx="160" cy="115" r="10" fill="url(#tasselHeadGrad)" />
    <circle cx="160" cy="115" r="4" fill="#FFF8D0" />

    <!-- Hanging Tassel 1 (Main) -->
    <g>
      <!-- Suspension Cord -->
      <line x1="160" y1="130" x2="160" y2="165" stroke="url(#ropeGold3D)" stroke-width="5" stroke-linecap="round" />
      
      <!-- Tassel Crown / Cap -->
      <path d="M 144,165 C 144,158 176,158 176,165 L 178,185 C 178,192 142,192 142,185 Z" fill="url(#tasselHeadGrad)" stroke="#3D2B05" stroke-width="1.5" />
      <circle cx="160" cy="175" r="4" fill="#FFEFA8" />

      <!-- Golden Waist Band -->
      <rect x="140" y="185" width="40" height="7" rx="3" fill="url(#ropeGold3D)" stroke="#3D2B05" stroke-width="1" />

      <!-- Flared Bullion Fringe Skirt -->
      <path d="M 142,192 L 130,295 C 150,305 170,305 190,295 L 178,192 Z" fill="url(#fringeSkirtGrad)" stroke="#3D2B05" stroke-width="1.5" />

      <!-- Individual Shimmering Fringe Strands -->
      <g stroke="#FFF2A3" stroke-width="1.5" opacity="0.85">
        <line x1="145" y1="195" x2="135" y2="295" />
        <line x1="150" y1="195" x2="143" y2="298" />
        <line x1="155" y1="195" x2="151" y2="302" />
        <line x1="160" y1="195" x2="160" y2="303" stroke-width="2" />
        <line x1="165" y1="195" x2="169" y2="302" />
        <line x1="170" y1="195" x2="177" y2="298" />
        <line x1="175" y1="195" x2="185" y2="295" />
      </g>
    </g>

    <!-- Hanging Tassel 2 (Secondary, slightly behind) -->
    <g transform="translate(-25, 20) scale(0.85)" opacity="0.9">
      <line x1="160" y1="130" x2="160" y2="165" stroke="url(#ropeGold3D)" stroke-width="4" stroke-linecap="round" />
      <path d="M 144,165 C 144,158 176,158 176,165 L 178,185 C 178,192 142,192 142,185 Z" fill="url(#tasselHeadGrad)" stroke="#3D2B05" stroke-width="1.5" />
      <rect x="140" y="185" width="40" height="7" rx="3" fill="url(#ropeGold3D)" stroke="#3D2B05" stroke-width="1" />
      <path d="M 142,192 L 130,295 C 150,305 170,305 190,295 L 178,192 Z" fill="url(#fringeSkirtGrad)" stroke="#3D2B05" stroke-width="1.5" />
    </g>
  </g>
</svg>
