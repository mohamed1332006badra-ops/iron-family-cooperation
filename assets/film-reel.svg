<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="100%" height="100%">
  <defs>
    <!-- 3D Gold Gradient for Reel Rim -->
    <linearGradient id="reelGoldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5BE" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#8C6A12" />
      <stop offset="90%" stop-color="#FFEAA7" />
      <stop offset="100%" stop-color="#4F3806" />
    </linearGradient>

    <!-- Inner Plate Shading -->
    <radialGradient id="reelInnerPlate" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#550810" />
      <stop offset="50%" stop-color="#300408" />
      <stop offset="85%" stop-color="#140103" />
      <stop offset="100%" stop-color="#090102" />
    </radialGradient>

    <filter id="reelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="15" stdDeviation="14" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <g filter="url(#reelShadow)">
    <!-- Outer Heavy Brass Flange -->
    <circle cx="130" cy="130" r="118" fill="url(#reelInnerPlate)" stroke="url(#reelGoldOuter)" stroke-width="8" />
    <!-- Beveled Inner Edge -->
    <circle cx="130" cy="130" r="112" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    <circle cx="130" cy="130" r="105" fill="none" stroke="url(#reelGoldOuter)" stroke-width="2" stroke-dasharray="6,4" />

    <!-- 5 Large Cutout Spoke Circles (Classic 35mm Hollywood Reel) -->
    <!-- Cutout 1 -->
    <circle cx="130" cy="58" r="26" fill="#0D0D14" stroke="url(#reelGoldOuter)" stroke-width="4" />
    <circle cx="130" cy="58" r="22" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <!-- Cutout 2 -->
    <circle cx="198" cy="108" r="26" fill="#0D0D14" stroke="url(#reelGoldOuter)" stroke-width="4" />
    <circle cx="198" cy="108" r="22" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <!-- Cutout 3 -->
    <circle cx="172" cy="188" r="26" fill="#0D0D14" stroke="url(#reelGoldOuter)" stroke-width="4" />
    <circle cx="172" cy="188" r="22" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <!-- Cutout 4 -->
    <circle cx="88" cy="188" r="26" fill="#0D0D14" stroke="url(#reelGoldOuter)" stroke-width="4" />
    <circle cx="88" cy="188" r="22" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <!-- Cutout 5 -->
    <circle cx="62" cy="108" r="26" fill="#0D0D14" stroke="url(#reelGoldOuter)" stroke-width="4" />
    <circle cx="62" cy="108" r="22" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />

    <!-- Center Spindle Hub Assembly -->
    <circle cx="130" cy="130" r="42" fill="url(#reelGoldOuter)" stroke="#3D2B05" stroke-width="3" />
    <circle cx="130" cy="130" r="34" fill="#181824" stroke="url(#reelGoldOuter)" stroke-width="2" />
    <circle cx="130" cy="130" r="16" fill="url(#reelGoldOuter)" />
    <!-- Drive Key Slot -->
    <circle cx="130" cy="130" r="8" fill="#08080C" />
    <rect x="127" y="118" width="6" height="8" rx="2" fill="#08080C" />
    <rect x="127" y="134" width="6" height="8" rx="2" fill="#08080C" />

    <!-- Outer Film Wind Preview Edge -->
    <path d="M 235,130 C 235,188 188,235 130,235 C 72,235 25,188 25,130" fill="none" stroke="#680912" stroke-width="4" stroke-dasharray="10,3" opacity="0.8" />
  </g>
</svg>
