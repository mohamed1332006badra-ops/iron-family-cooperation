<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 230" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradients for Frame & Hinges -->
    <linearGradient id="clapGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#8C6A12" />
      <stop offset="100%" stop-color="#4F3806" />
    </linearGradient>

    <!-- Slate Board Gradient -->
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242430" />
      <stop offset="60%" stop-color="#14141E" />
      <stop offset="100%" stop-color="#0B0B10" />
    </linearGradient>

    <filter id="clapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <g filter="url(#clapShadow)" transform="rotate(-6, 140, 115)">
    <!-- Main Slate Board (Lower Body) -->
    <rect x="25" y="70" width="230" height="150" rx="8" fill="url(#slateGrad)" stroke="url(#clapGold)" stroke-width="3" />

    <!-- Slate Field Grid Lines -->
    <line x1="25" y1="120" x2="255" y2="120" stroke="url(#clapGold)" stroke-width="1.5" opacity="0.6" />
    <line x1="25" y1="170" x2="255" y2="170" stroke="url(#clapGold)" stroke-width="1.5" opacity="0.6" />
    <line x1="105" y1="120" x2="105" y2="220" stroke="url(#clapGold)" stroke-width="1.5" opacity="0.6" />
    <line x1="185" y1="120" x2="185" y2="220" stroke="url(#clapGold)" stroke-width="1.5" opacity="0.6" />

    <!-- Chalkboard Text Labels -->
    <text x="35" y="92" font-family="'Cairo', 'Inter', sans-serif" font-weight="800" font-size="12" fill="url(#clapGold)" letter-spacing="1">PROD: IRON FAMILY CINEMA</text>
    <text x="35" y="110" font-family="'Cairo', sans-serif" font-weight="700" font-size="10" fill="#E2E8F0">سينما الأسرة الحديدية • 2026</text>

    <text x="35" y="140" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="url(#clapGold)">SCENE</text>
    <text x="58" y="160" font-family="'Inter', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">01</text>

    <text x="115" y="140" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="url(#clapGold)">TAKE</text>
    <text x="138" y="160" font-family="'Inter', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">01</text>

    <text x="195" y="140" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="url(#clapGold)">ROLL</text>
    <text x="210" y="160" font-family="'Inter', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">A1</text>

    <text x="35" y="190" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="url(#clapGold)">DIRECTOR: GENERAL INQUIRY</text>
    <text x="35" y="208" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="url(#clapGold)">CAMERA: 4K HDR PREMIERE</text>

    <!-- Lower Clapper Stick (Fixed) -->
    <rect x="25" y="44" width="230" height="26" fill="#181822" stroke="url(#clapGold)" stroke-width="2.5" />
    <!-- Diagonal Stripes on Lower Stick -->
    <g fill="#FFFFFF">
      <polygon points="50,44 75,44 55,70 30,70" />
      <polygon points="100,44 125,44 105,70 80,70" />
      <polygon points="150,44 175,44 155,70 130,70" />
      <polygon points="200,44 225,44 205,70 180,70" />
    </g>

    <!-- Upper Clapper Stick (Open at 20deg angle) -->
    <g transform="rotate(-18, 30, 44)">
      <rect x="25" y="18" width="230" height="26" fill="#181822" stroke="url(#clapGold)" stroke-width="2.5" />
      <!-- Diagonal Stripes on Upper Stick -->
      <g fill="#FFFFFF">
        <polygon points="50,18 75,18 55,44 30,44" />
        <polygon points="100,18 125,18 105,44 80,44" />
        <polygon points="150,18 175,18 155,44 130,44" />
        <polygon points="200,18 225,18 205,44 180,44" />
      </g>
    </g>

    <!-- Heavy Brass Left Hinge Assembly -->
    <rect x="20" y="32" width="22" height="42" rx="4" fill="url(#clapGold)" stroke="#3D2B05" stroke-width="1.5" />
    <circle cx="31" cy="42" r="4.5" fill="#181822" stroke="#FFF2A3" stroke-width="1" />
    <circle cx="31" cy="64" r="4.5" fill="#181822" stroke="#FFF2A3" stroke-width="1" />
  </g>
</svg>
