<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <!-- Brass / Dark Gold Metallic Gradients -->
    <linearGradient id="projBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#8C6A12" />
      <stop offset="100%" stop-color="#3D2B05" />
    </linearGradient>

    <linearGradient id="projBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2D38" />
      <stop offset="50%" stop-color="#181822" />
      <stop offset="100%" stop-color="#0E0E14" />
    </linearGradient>

    <!-- Projector Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFF5BE" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <filter id="projShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <g filter="url(#projShadow)">
    <!-- Ceiling Mount / Bracket -->
    <rect x="112" y="0" width="16" height="24" fill="url(#projBrass)" />
    <polygon points="100,24 140,24 134,36 106,36" fill="url(#projBrass)" />

    <!-- Upper Feed Reel (Top Left Spool) -->
    <g transform="translate(70, 48)">
      <circle cx="0" cy="0" r="32" fill="#0D0D12" stroke="url(#projBrass)" stroke-width="3" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#projBrass)" stroke-width="1.5" stroke-dasharray="4,3" />
      <circle cx="0" cy="0" r="12" fill="url(#projBrass)" />
      <circle cx="0" cy="0" r="5" fill="#181822" />
      <!-- Reel Spokes -->
      <line x1="-28" y1="0" x2="28" y2="0" stroke="url(#projBrass)" stroke-width="2" />
      <line x1="0" y1="-28" x2="0" y2="28" stroke="url(#projBrass)" stroke-width="2" />
      <line x1="-20" y1="-20" x2="20" y2="20" stroke="url(#projBrass)" stroke-width="2" />
      <line x1="-20" y1="20" x2="20" y2="-20" stroke="url(#projBrass)" stroke-width="2" />
      <!-- Film Ribbon wrapped -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#5A0810" stroke-width="4" stroke-dasharray="8,2" />
    </g>

    <!-- Lower Take-up Reel (Top Right Spool) -->
    <g transform="translate(170, 48)">
      <circle cx="0" cy="0" r="32" fill="#0D0D12" stroke="url(#projBrass)" stroke-width="3" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#projBrass)" stroke-width="1.5" stroke-dasharray="4,3" />
      <circle cx="0" cy="0" r="12" fill="url(#projBrass)" />
      <circle cx="0" cy="0" r="5" fill="#181822" />
      <!-- Reel Spokes -->
      <line x1="-28" y1="0" x2="28" y2="0" stroke="url(#projBrass)" stroke-width="2" />
      <line x1="0" y1="-28" x2="0" y2="28" stroke="url(#projBrass)" stroke-width="2" />
      <line x1="-20" y1="-20" x2="20" y2="20" stroke="url(#projBrass)" stroke-width="2" />
      <line x1="-20" y1="20" x2="20" y2="-20" stroke="url(#projBrass)" stroke-width="2" />
      <!-- Film Ribbon wrapped -->
      <circle cx="0" cy="0" r="18" fill="none" stroke="#5A0810" stroke-width="4" stroke-dasharray="8,2" />
    </g>

    <!-- Main Projector Body Housing -->
    <rect x="65" y="70" width="110" height="68" rx="10" fill="url(#projBodyGrad)" stroke="url(#projBrass)" stroke-width="2" />
    
    <!-- Gold Trim Accents on Body -->
    <line x1="72" y1="84" x2="168" y2="84" stroke="url(#projBrass)" stroke-width="1.5" />
    <line x1="72" y1="126" x2="168" y2="126" stroke="url(#projBrass)" stroke-width="1.5" />
    <!-- Ventilation Grille -->
    <line x1="85" y1="94" x2="115" y2="94" stroke="#48485E" stroke-width="2" stroke-linecap="round" />
    <line x1="85" y1="102" x2="115" y2="102" stroke="#48485E" stroke-width="2" stroke-linecap="round" />
    <line x1="85" y1="110" x2="115" y2="110" stroke="#48485E" stroke-width="2" stroke-linecap="round" />
    <line x1="85" y1="118" x2="115" y2="118" stroke="#48485E" stroke-width="2" stroke-linecap="round" />

    <!-- Brass Badging / Monogram -->
    <circle cx="145" cy="106" r="14" fill="url(#projBrass)" stroke="#111" stroke-width="1" />
    <polygon points="145,98 147,104 153,104 148,108 150,114 145,110 140,114 142,108 137,104 143,104" fill="#181822" />

    <!-- Projector Lens Assembly Extending Forward / Downward -->
    <polygon points="104,138 136,138 144,162 96,162" fill="url(#projBodyGrad)" stroke="url(#projBrass)" stroke-width="2" />
    <!-- Brass Lens Ring -->
    <ellipse cx="120" cy="162" rx="24" ry="8" fill="url(#projBrass)" stroke="#332204" stroke-width="1.5" />
    <!-- Intense Glass Lamp Element -->
    <ellipse cx="120" cy="162" rx="18" ry="6" fill="url(#lampGlow)" />
  </g>
</svg>
