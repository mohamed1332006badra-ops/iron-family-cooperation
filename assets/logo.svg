<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Radial Dark Glow Background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E0D12" />
      <stop offset="60%" stop-color="#0F090C" />
      <stop offset="100%" stop-color="#0D0D12" />
    </radialGradient>

    <!-- Deep Red Gradient -->
    <linearGradient id="deepRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C41525" />
      <stop offset="40%" stop-color="#9B111E" />
      <stop offset="100%" stop-color="#5E0911" />
    </linearGradient>

    <!-- Royal Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA8219" />
      <stop offset="100%" stop-color="#6E500B" />
    </linearGradient>

    <!-- Inner Gold Shimmer -->
    <linearGradient id="goldShimmer" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA8219" />
      <stop offset="50%" stop-color="#FFEAA7" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="goldGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Circular Outer Frame -->
  <circle cx="250" cy="250" r="236" fill="url(#bgGlow)" />
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.8" />
  
  <!-- Outer Beaded Ring -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <circle cx="250" cy="20" r="3.5" />
    <circle cx="250" cy="480" r="3.5" />
    <circle cx="20" cy="250" r="3.5" />
    <circle cx="480" cy="250" r="3.5" />
    <circle cx="87" cy="87" r="3" />
    <circle cx="413" cy="87" r="3" />
    <circle cx="87" cy="413" r="3" />
    <circle cx="413" cy="413" r="3" />
  </g>

  <!-- Majestic Shield / Crest -->
  <g filter="url(#shadowFilter)">
    <!-- Shield Outer Gold Border -->
    <path d="M 250,55 C 330,55 400,85 400,165 C 400,285 320,380 250,425 C 180,380 100,285 100,165 C 100,85 170,55 250,55 Z" 
          fill="url(#deepRedGrad)" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />

    <!-- Shield Inner Trim Line -->
    <path d="M 250,72 C 318,72 380,98 380,168 C 380,272 310,358 250,398 C 190,358 120,272 120,168 C 120,98 182,72 250,72 Z" 
          fill="none" stroke="url(#goldShimmer)" stroke-width="2" opacity="0.85" />
  </g>

  <!-- Laurel Wreath Around Shield -->
  <g fill="url(#goldGrad)" opacity="0.95">
    <!-- Left Leaves -->
    <path d="M 115,220 C 95,200 80,175 75,145 C 85,155 100,165 110,185 Z" />
    <path d="M 98,265 C 78,250 68,225 65,195 C 75,210 90,225 98,235 Z" />
    <path d="M 105,310 C 85,300 75,275 72,248 C 84,260 97,272 105,285 Z" />
    <path d="M 125,355 C 105,348 95,325 90,300 C 102,312 115,322 125,335 Z" />
    <path d="M 158,395 C 138,390 125,370 120,348 C 132,358 147,368 158,375 Z" />
    <path d="M 200,425 C 180,422 165,405 158,385 C 172,392 188,400 200,405 Z" />

    <!-- Right Leaves -->
    <path d="M 385,220 C 405,200 420,175 425,145 C 415,155 400,165 390,185 Z" />
    <path d="M 402,265 C 422,250 432,225 435,195 C 425,210 410,225 402,235 Z" />
    <path d="M 395,310 C 415,300 425,275 428,248 C 416,260 403,272 395,285 Z" />
    <path d="M 375,355 C 395,348 405,325 410,300 C 398,312 385,322 375,335 Z" />
    <path d="M 342,395 C 362,390 375,370 380,348 C 368,358 353,368 342,375 Z" />
    <path d="M 300,425 C 320,422 335,405 342,385 C 328,392 312,400 300,405 Z" />
  </g>

  <!-- Crown / Star Ensemble At Top -->
  <g fill="url(#goldGrad)" filter="url(#goldGlowFilter)">
    <polygon points="250,78 257,98 278,98 261,110 267,130 250,118 233,130 239,110 222,98 243,98" />
    <polygon points="215,92 219,105 233,105 222,113 226,126 215,118 204,126 208,113 197,105 211,105" transform="scale(0.8) translate(50, 20)" />
    <polygon points="285,92 289,105 303,105 292,113 296,126 285,118 274,126 278,113 267,105 281,105" transform="scale(0.8) translate(80, 20)" />
  </g>

  <!-- Cinema Elements: Golden Film Reel & Clapperboard Shield Centerpiece -->
  <!-- Film Reel Background Circle -->
  <g>
    <circle cx="250" cy="225" r="82" fill="#0D0D12" stroke="url(#goldGrad)" stroke-width="5" />
    <circle cx="250" cy="225" r="72" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,4" />
    <circle cx="250" cy="225" r="30" fill="url(#deepRedGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="250" cy="225" r="12" fill="url(#goldGrad)" />
    
    <!-- Film Reel Cutout Holes -->
    <circle cx="250" cy="172" r="16" fill="url(#deepRedGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="298" cy="200" r="16" fill="url(#deepRedGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="280" cy="260" r="16" fill="url(#deepRedGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="220" cy="260" r="16" fill="url(#deepRedGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="202" cy="200" r="16" fill="url(#deepRedGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

    <!-- Vintage Cinema Camera Silhouette / Clapperboard Crest -->
    <path d="M 235,210 L 265,210 L 265,240 L 235,240 Z" fill="url(#goldGrad)" />
    <polygon points="265,218 282,207 282,243 265,232" fill="url(#goldGrad)" />
  </g>

  <!-- Golden Cinema Film Ribbon Banners Across Bottom of Shield -->
  <g filter="url(#shadowFilter)">
    <!-- Lower Banner Ribbon -->
    <path d="M 130,345 L 250,330 L 370,345 L 355,385 L 250,370 L 145,385 Z" 
          fill="url(#deepRedGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Ribbon Ends -->
    <polygon points="130,345 105,365 145,385 138,365" fill="#4A070D" stroke="url(#goldGrad)" stroke-width="1.5" />
    <polygon points="370,345 395,365 355,385 362,365" fill="#4A070D" stroke="url(#goldGrad)" stroke-width="1.5" />
  </g>

  <!-- Emblem Monogram Text / Cinema Reel Flourish -->
  <text x="250" y="362" font-family="'Cairo', 'Arial', sans-serif" font-weight="900" font-size="20" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">
    IRON FAMILY CINEMA
  </text>

  <!-- Decorative Corner Accents -->
  <path d="M 70,50 L 95,50 A 10 10 0 0 0 95,40 L 50,40 L 50,85 A 10 10 0 0 0 60,85 L 60,60" fill="url(#goldGrad)" opacity="0.7" />
  <path d="M 430,50 L 405,50 A 10 10 0 0 1 405,40 L 450,40 L 450,85 A 10 10 0 0 1 440,85 L 440,60" fill="url(#goldGrad)" opacity="0.7" />
  <path d="M 70,450 L 95,450 A 10 10 0 0 1 95,460 L 50,460 L 50,415 A 10 10 0 0 1 60,415 L 60,440" fill="url(#goldGrad)" opacity="0.7" />
  <path d="M 430,450 L 405,450 A 10 10 0 0 0 405,460 L 450,460 L 450,415 A 10 10 0 0 0 440,415 L 440,440" fill="url(#goldGrad)" opacity="0.7" />
</svg>
