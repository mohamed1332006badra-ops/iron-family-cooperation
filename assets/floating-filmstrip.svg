<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <!-- 35mm Film Ribbon Gradient -->
    <linearGradient id="filmRibbonGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#14141E" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#2D1218" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#4A0812" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#181824" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="sprocketGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF5BE" />
      <stop offset="100%" stop-color="#AA8219" />
    </linearGradient>

    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <g filter="url(#ribbonShadow)">
    <!-- Undulating Curving 3D 35mm Ribbon Body -->
    <path d="M 10,130 C 70,60 140,160 210,90 C 250,50 280,70 310,40 L 310,88 C 280,118 250,98 210,138 C 140,208 70,108 10,178 Z" 
          fill="url(#filmRibbonGrad)" stroke="url(#sprocketGold)" stroke-width="2" />

    <!-- Top & Bottom Perforations along curve -->
    <!-- Top Sprockets -->
    <g fill="url(#sprocketGold)">
      <circle cx="35" cy="115" r="3" />
      <circle cx="65" cy="98" r="3" />
      <circle cx="95" cy="100" r="3" />
      <circle cx="125" cy="118" r="3" />
      <circle cx="155" cy="130" r="3" />
      <circle cx="185" cy="118" r="3" />
      <circle cx="215" cy="95" r="3" />
      <circle cx="245" cy="74" r="3" />
      <circle cx="275" cy="65" r="3" />
    </g>

    <!-- Bottom Sprockets -->
    <g fill="url(#sprocketGold)">
      <circle cx="35" cy="155" r="3" />
      <circle cx="65" cy="138" r="3" />
      <circle cx="95" cy="140" r="3" />
      <circle cx="125" cy="158" r="3" />
      <circle cx="155" cy="170" r="3" />
      <circle cx="185" cy="158" r="3" />
      <circle cx="215" cy="135" r="3" />
      <circle cx="245" cy="114" r="3" />
      <circle cx="275" cy="105" r="3" />
    </g>

    <!-- Film Frame Dividers (Translucent Windows) -->
    <path d="M 50,112 L 50,148" stroke="url(#sprocketGold)" stroke-width="1.5" opacity="0.7" />
    <path d="M 110,108 L 110,148" stroke="url(#sprocketGold)" stroke-width="1.5" opacity="0.7" />
    <path d="M 170,124 L 170,164" stroke="url(#sprocketGold)" stroke-width="1.5" opacity="0.7" />
    <path d="M 230,86 L 230,126" stroke="url(#sprocketGold)" stroke-width="1.5" opacity="0.7" />
    <path d="M 290,60 L 290,98" stroke="url(#sprocketGold)" stroke-width="1.5" opacity="0.7" />
  </g>
</svg>
